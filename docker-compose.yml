services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: mirrors.tuna.tsinghua.edu.cn
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: mcp
    restart: unless-stopped
    shm_size: '4gb'
    volumes:
      - ./:/app:rw
      - mcp_config:/app/config:rw
    ports:
      - "8876:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MCP_CONFIG_FILE=/app/config/user_config.json
    dns:
      - 10.255.255.254
      - 223.5.5.5
      - 119.29.29.29
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  redis:
    # 2026-09-17: 6.2 已 EOL，升到 8.x（客户端 redis-py 已是 8.1）。
    # Redis 8 首次启动会把旧的单文件 appendonly.aof 自动迁移进 appendonlydir/，
    # 这是单向的：退回 redis:6 前必须先从备份恢复，否则 appendonly yes 会以空库启动。
    image: redis:8-alpine
    container_name: mcp-redis
    restart: unless-stopped
    # Redis is now only the HOT tier: immutable platform data (datafields,
    # datasets, operators, alpha records and PnL) lives in the permanent on-disk
    # store under ./cache, which is 19x smaller compressed and costs no RAM.
    # A cap plus volatile-lru turns memory pressure into eviction of TTL'd cache
    # entries instead of the previous behaviour (no cap + noeviction), where
    # exhausting RAM made every write fail.
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    ports:
      - 6479:6379

volumes:
  redis_data:
  mcp_config:
